# Blueprint de Render: base Postgres gratis + servicio web en Docker.
# Despliegue: sube el repo a GitHub, en Render -> New -> Blueprint, elige el repo.
databases:
  - name: cyberal-db
    plan: free            # Postgres gratis (ojo: la BD gratis caduca a los 30 días)
    databaseName: cyberal
    user: cyberal

services:
  - type: web
    name: cyberal
    runtime: docker
    plan: free            # el servicio web gratis se duerme tras 15 min de inactividad
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberal-db
          property: connectionString   # Render la entrega como postgres://... ; la app la normaliza
      - key: SECRET_KEY
        generateValue: true            # Render genera una clave segura
      - key: WEB_WORKERS
        value: "2"                     # el plan gratis es chico (512 MB)
